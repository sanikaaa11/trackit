name: trackit
description: "TrackIt 2.0 - Personal productivity app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4
  telephony: ^0.2.0
  pedometer: ^4.0.2
  pdf: ^3.10.8
  permission_handler: ^11.3.1
  printing: ^5.12.0
  flutter_svg: ^2.0.10+1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  hive_flutter: ^1.1.0
  google_generative_ai: ^0.4.7
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.3
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  lottie: ^3.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/badges/
    - assets/animations/